<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Quick Fact Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main id="main-content">
    <div class="error-page">
      <div class="error-number">404</div>
      <div class="error-emoji" aria-hidden="true">🔍</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">Looks like this page doesn't exist. It may have been moved or the URL might be wrong.</p>
      <div class="cta-row">
        <a href="/" class="btn-primary" style="display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none;width:auto;padding:0.85rem 2rem">
          ← Go Home
        </a>
        <a href="/about" class="btn-outline">About Us</a>
      </div>
    </div>
  </main>

  {% include '_footer.html' %}
  {% include '_auth_modal.html' %}

  <div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
